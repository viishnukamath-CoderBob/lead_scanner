# One-click deploy on Render (https://render.com): New > Blueprint > point at this repo.
# Gives a shared HTTPS URL + a managed cloud PostgreSQL database.
services:
  - type: web
    name: lead-capture
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FORCE_HTTPS
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lead-capture-db
          property: connectionString
databases:
  - name: lead-capture-db
    plan: free
